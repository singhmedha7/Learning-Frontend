<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accumulator pattern, Break, Continue</title>
</head>
<body>
    <!--Accumulator pattern accumulates values through loopiing.
    Common Scenarios:
     Sum all numbers in an array
     Create a modified copy of an array-->

     <!--Break lets you stop a loop early.
     Continue is used to skip one iteration or the current iteration.
     In while loop remember to do the increment manually before using continue.-->
     <script>
        // Accumulator Pattern
        let nums =[3,5,7,24];
        console.log(nums);
        let sum=0;
        for(let i=0;i<nums.length;i++){
            sum+=nums[i];
        }
        console.log(`Sum of the array is: ${sum}`);

        let squares=[];
        for(let i=0;i<nums.length;i++){
            squares.push(nums[i]*nums[i]);
            // squares[i]=nums[i]*nums[i];
        }
        console.log(squares);

        //Break
        for(let i=0;i<50;i++){
            console.log(i);
            if (i===34){
                break;
            }
        }

        let arr=[1,4,,5,7,8,3,2];
        for(let i=0;i<arr.length;i++){
            if(arr[i]===8){
                console.log('Number found at index ' + i);
                break;
            }
            console.log('Still looking');
        }

        //Continue
        for(let i=1;i<=25;i++){
            if(i%2===0){
                continue;
            }
            console.log(i);
        }
     </script>
</body>
</html>
