<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    <!--Code that runs multiple times based on a condition is a loop.
    Loops alse alter the flow of execution like functions.
    Loops are repeated execution of code.
    Loops automate repetitive
    There for, while, and do while loops.
    Iteration is the number of times a loop runs.-->

    <!--While loop is used for non-standard consitions.
    It runs the block of code while the condiiton is true.
    We need to always include a update to avoid infinite loops.
    Syntax: while(condition){//Body of loop}-->

    <!--Do While loop executes block first, then cheks condition.
    It is guaranteed to run at least one iteration.
    Unlike while, first iteration is unconditioned.
    Don't forget to update condition to avoid infinite loops.
    Syntax: do{//Body of loop}while(condition);-->

    <script>
        // while loop
        let num=1; //Initialisation
        while(num<=10){ //Condition
            console.log(num);
            num++; //Updating
        }
        console.log("Final value of num: " + num);

        let num1=0;
        while(num1<1){
            console.log(num1);
            num1=Math.random()*2;
        }
        console.log("Final: " + num1)

        // do while
        let num2=0
        do{
            console.log(num2);
            num2++;
        }while(num2<5);
        console.log("Final value of num2: " + num2);

        let num3=0
        do{
            console.log(num3);
            num3++;
        }while(false);
        console.log("Final value of num3: " + num3);
    </script>
</body>
</html>
