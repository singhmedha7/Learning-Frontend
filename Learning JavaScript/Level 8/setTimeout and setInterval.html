<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout and setInterval</title>
</head>
<body>
    <!--Functions for executing code asynchronously after a dalay.
    setTimeout runs once; setInterval runs repeatedly.
    
    setTimeout:
     Syntax:setTimeout(function,time)
     Cancel:clearTimeout(timerID)

    setInterval:
     Syntax:setInterval(function,time)
     Cancel:clearInterval(intervalID)-->

     <script>
        //Don't call a function inside setTimeout if function is defined in a varioable.Only pass it as done with sum in sumThree
        let alarm=()=>console.log(`It is late, go to sleep ${new Date}`)
        let timerID=setTimeout(alarm,5000);
        console.log(`Alarm Set with timer ID ${timerID}`);

        //clearTimeout(1); timerID is 1

        let intervalID=setInterval(alarm,2000);
        console.log(`IntervalID is ${intervalID}`);

        setTimeout(()=>clearInterval(2),5000);
     </script>
</body>
</html>
